[project]
name = "qfl"
version = "0.1.0"
description = "Quant Finance Lab"
requires-python = ">=3.11"

dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfl"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
